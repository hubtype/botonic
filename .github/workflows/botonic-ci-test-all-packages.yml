name: Botonic CI test all packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  botonic-cli-tests:
    uses: ./.github/workflows/botonic-common-workflow.yml
    with:
      PACKAGE_NAME: Botonic cli tests
      PACKAGE: botonic-cli
      UNIT_TEST_COMMAND: npm run test_ci

  botonic-core-tests:
    uses: ./.github/workflows/botonic-common-workflow.yml
    with:
      PACKAGE_NAME: Botonic core tests
      PACKAGE: botonic-core

  botonic-plugin-ai-agents-tests:
    uses: ./.github/workflows/botonic-common-workflow.yml
    with:
      PACKAGE_NAME: Botonic plugin-ai-agents tests
      PACKAGE: botonic-plugin-ai-agents
      BUILD_COMMAND: 'cd ../botonic-core && npm run build && cd ../botonic-plugin-ai-agents && npm run build'

  botonic-plugin-flow-builder-tests:
    uses: ./.github/workflows/botonic-common-workflow.yml
    with:
      PACKAGE_NAME: Botonic plugin-flow-builder tests
      PACKAGE: botonic-plugin-flow-builder
      BUILD_COMMAND: 'cd ../botonic-core && npm run build && cd ../botonic-react && npm run build && cd ../botonic-plugin-flow-builder && npm run build'

  botonic-plugin-hubtype-analytics-tests:
    uses: ./.github/workflows/botonic-common-workflow.yml
    with:
      PACKAGE_NAME: Botonic plugin-hubtype-analytics tests
      PACKAGE: botonic-plugin-hubtype-analytics
      BUILD_COMMAND: 'cd ../botonic-core && npm run build && cd ../botonic-plugin-hubtype-analytics && npm run build'

  botonic-react-tests:
    uses: ./.github/workflows/botonic-common-workflow.yml
    with:
      PACKAGE_NAME: Botonic react tests
      PACKAGE: botonic-react
      BUILD_COMMAND: 'cd ../botonic-core && npm run build && cd ../botonic-react && npm run build'
